name: CI

on:
  push:
    branches:
      - main
      - alpha
      - 'feature/*'
  pull_request:
    branches:
      - main
      - alpha

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create CI assets
        run: |
          mkdir -p assets/images
          echo "MAPBOX_PUBLIC_TOKEN=ci_placeholder" > .env

      - name: Install dependencies
        run: flutter pub get

      - name: Run analyzer
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create CI assets
        run: |
          mkdir -p assets/images
          echo "MAPBOX_PUBLIC_TOKEN=ci_placeholder" > .env

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Create CI assets
        run: |
          mkdir -p assets/images
          echo "MAPBOX_PUBLIC_TOKEN=ci_placeholder" > .env

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
