name: fieldguard
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.3.1

  # Navigation
  go_router: ^14.8.1

  # Networking
  dio: ^5.9.2

  # UI utilities
  fluttertoast: ^8.2.4
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.0.0

  # Device / platform
  geolocator: ^14.0.2
  permission_handler: ^11.0.0

  # Functional programming
  dartz: ^0.10.1
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
