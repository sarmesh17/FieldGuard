name: fieldguard
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  file_picker: ^8.0.0+1
  image_picker: ^1.1.2
  geocoding: ^3.0.0

  # State management
  flutter_riverpod: ^3.3.1

  # Navigation
  go_router: ^14.8.1

  # Networking
  dio: ^5.9.2

  # UI utilities
  fluttertoast: ^8.2.4
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.0.0
  intl: ^0.19.0


  # Map
  mapbox_maps_flutter: ^2.3.0

  # Device / platform
  geolocator: ^14.0.2
  permission_handler: ^11.0.0

  # Environment
  flutter_dotenv: ^5.2.1

  # Functional programming
  dartz: ^0.10.1
  provider: ^6.1.5+1
  open_file: ^3.5.11
  
  # Secure storage
  flutter_secure_storage: ^9.2.2

  # Local notifications (geofence arrival/departure heads-up alerts +
  # foreground-service notification for background location tracking)
  flutter_local_notifications: ^18.0.1

  # Image compression
  flutter_image_compress: ^2.4.0
  socket_io_client: ^3.1.4
  flutter_background_service: ^5.1.0
  flutter_jailbreak_detection: ^1.10.0
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  package_info_plus: ^9.0.1
  printing: ^5.14.3
  pdf: ^3.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env

# ─── App launcher icon ───────────────────────────────────────────────────────
# Put a 1024×1024 PNG at assets/icon/app_icon.png, then run:
#   dart run flutter_launcher_icons
# Generates every Android density (+ adaptive icon) and the iOS AppIcon set.
flutter_launcher_icons:
  image_path: "assets/icon/FieldGuard-HQ.png"
  android: "ic_launcher"
  min_sdk_android: 21
  # Adaptive icon (Android 8+): cream background (matches the icon) + the icon
  # as foreground. Tip: give the foreground some padding — the OS masks it to a
  # circle/squircle and only the centre ~66% is always visible.
  adaptive_icon_background: "#F8F6F1"
  adaptive_icon_foreground: "assets/icon/FieldGuard-HQ.png"
  ios: true
  remove_alpha_ios: true
